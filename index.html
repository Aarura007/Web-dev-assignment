<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Expense Tracker🤑</title>

    <link
        href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="container">

        <header>
            <h1>💸 Expense Tracker 💸</h1>
            <p>Track your spending. Save your money.</p>
        </header>

        <section class="summary">
            <div class="summary-card">
                <p>Total Expenses</p>
                <h2 id="totalAmount">₹0.00</h2>
            </div>

            <div class="summary-card">
                <p>Total Transactions</p>
                <h2 id="totalCount">0</h2>
            </div>
        </section>

        <section class="expense-form">
            <h2>Add New Expense</h2>

            <form id="expenseForm">

                <div class="input-group">
                    <label for="expenseName">Expense Name</label>
                    <input type="text" id="expenseName" placeholder="e.g. Lunch, Books..." required>
                </div>

                <div class="input-group">
                    <label for="expenseAmount">Amount (₹)</label>
                    <input type="number" id="expenseAmount" placeholder="Enter amount" min="0.01" step="0.01" required>
                </div>

                <div class="input-group">
                    <label for="expenseCategory">Category</label>
                    <select id="expenseCategory" required>
                        <option value="">Select Category</option>
                        <option value="Food">🍱 Food</option>
                        <option value="Travel">✈️ Travel</option>
                        <option value="Shopping">🛍️ Shopping</option>
                        <option value="Education">📚 Education</option>
                        <option value="Other">🪩 Other</option>
                    </select>
                </div>

                <button type="submit" class="add-btn">
                    + Add Expense
                </button>

            </form>
        </section>

        <section class="expense-list-section">

            <div class="list-header">
                <h2>Recent Expenses</h2>

                <select id="categoryFilter">
                    <option value="All">All Categories</option>
                    <option value="Food">🍱 Food</option>
                    <option value="Travel">✈️ Travel</option>
                    <option value="Shopping">🛍️ Shopping</option>
                    <option value="Education">📚 Education</option>
                    <option value="Other">🪩 Other</option>
                </select>
            </div>

            <div id="expenseList">
                <!-- Expenses will appear here -->
            </div>

        </section>

        <footer>
            <p>Made with 🤑 for Students | Expense Tracker💰</p>
        </footer>

    </div>

    <script src="script.js"></script>
</body>

</html>
